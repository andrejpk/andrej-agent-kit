<title>Hill climb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a lab notebook for one climb. Summary first (scoreboard), then where the
   problem lives (breakdown), where it's going (next up), every idea tried, the
   criteria's revisions and the numbered reports that show the work. */
:root {
  --bg: #f5f7f7; --surface: #ffffff; --sunken: #eef2f2;
  --ink: #142120; --ink-2: #485654; --muted: #687674;
  --hair: #dde5e4; --hair-2: #c5d0ce;
  --accent: #2a78d6; --accent-soft: #2a78d61f; --holdout: #eb6834;
  --good: #0ca30c; --good-ink: #0a6e0a; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --f-text: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101615; --surface: #172020; --sunken: #131b1a;
    --ink: #e5eeec; --ink-2: #b3c1be; --muted: #8b9a97;
    --hair: #243030; --hair-2: #33403f;
    --accent: #3987e5; --accent-soft: #3987e529; --holdout: #d95926;
    --good-ink: #4cc24c;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101615; --surface: #172020; --sunken: #131b1a;
  --ink: #e5eeec; --ink-2: #b3c1be; --muted: #8b9a97;
  --hair: #243030; --hair-2: #33403f;
  --accent: #3987e5; --accent-soft: #3987e529; --holdout: #d95926;
  --good-ink: #4cc24c;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-text); }
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px }
a { color: var(--accent); text-underline-offset: 2px }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-head); text-wrap: balance; margin: 0; letter-spacing: -.01em }
h1 { font-size: clamp(28px, 4.2vw, 40px); font-weight: 600; line-height: 1.1 }
h2 { font-size: 22px; font-weight: 600 }
h3 { font-size: 16px; font-weight: 600 }
p { margin: 0 }
.eyebrow, .label { font: 500 11.5px/1.3 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.mono, .num { font-family: var(--f-data); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
section { display: grid; gap: 14px; min-width: 0 }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px }
.section-head p { color: var(--ink-2); max-width: 70ch }

/* header */
.top { display: grid; gap: 12px }
.top .eyebrow { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center }
.summary { color: var(--ink-2); max-width: 68ch; font-size: 16px }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 13.5px }
.meta b { color: var(--ink-2); font-weight: 500 }
.phase { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--ink); text-transform: none; letter-spacing: 0; font: 500 12.5px/1.6 var(--f-text) }
.phase::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent) }
.attention { display: flex; flex-wrap: wrap; gap: 10px }
.callout { flex: 1 1 260px; min-width: 0; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 4px; font-size: 14px }
.callout ul { margin: 0; padding-left: 18px }

/* scoreboard */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px }
.metric { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px 16px 12px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.metric.primary { border-color: var(--hair-2) }
.m-head { display: flex; justify-content: space-between; gap: 8px; align-items: center }
.big { font: 500 32px/1.05 var(--f-data); font-variant-numeric: tabular-nums; letter-spacing: -.02em }
.big .unit { font-size: 15px; color: var(--muted); margin-left: 4px; letter-spacing: 0 }
.delta { font-size: 13.5px; color: var(--ink-2) }
.refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 6px 10px; margin: 0; padding-top: 8px; border-top: 1px solid var(--hair) }
.refs div { display: grid; min-width: 0 }
.refs dt { font: 500 10.5px/1.4 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.refs dd { margin: 0; font: 400 13.5px/1.4 var(--f-data); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.spark { width: 100%; height: 46px; display: block }
.chart-btn { justify-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 500 13px/1 var(--f-text); color: var(--ink); background: var(--sunken); border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; cursor: pointer }
.chart-btn:hover { border-color: var(--hair-2) }
.chart-btn .chev { transition: transform .15s }
.chart-btn[aria-expanded="true"] .chev { transform: rotate(180deg) }
.chart-btn .count { color: var(--muted); font-family: var(--f-data); font-size: 12px }
.panels { display: grid; gap: 12px }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0 }
.panel .how { color: var(--ink-2); font-size: 13.5px; max-width: 80ch }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend svg { flex: none }
.chart-wrap { position: relative; overflow-x: auto }
.chart { width: 100%; min-width: 520px; height: auto; display: block }
.chart text { font: 11px var(--f-data); fill: var(--muted) }
.chart .lbl { fill: var(--ink-2) }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.4; padding: 7px 9px; border-radius: 6px; max-width: 280px; z-index: 2 }
.tip b { font-weight: 600 }
details.table-view summary { cursor: pointer; font-size: 13px; color: var(--ink-2) }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px }
.mini th, .mini td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--hair) }
.mini td.num { text-align: right }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font: 500 12px/1.5 var(--f-text); padding: 1px 8px 1px 6px; border-radius: 99px; border: 1px solid var(--hair-2); color: var(--ink); white-space: nowrap; background: var(--surface) }
.pill i { font-style: normal; font-size: 11px; width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff }
.pill.kept i, .pill.target i { background: var(--good) }
.pill.rejected i { background: var(--muted) }
.pill.parked i, .pill.floor i { background: var(--warn); color: #3a2a00 }
.pill.running i { background: var(--accent) }
.pill.backlog i { background: transparent; border: 1.5px solid var(--muted); color: var(--muted) }
.pill.below i, .pill.none i { background: var(--critical) }
.role { font: 500 10.5px/1.4 var(--f-data); letter-spacing: .07em; text-transform: uppercase; color: var(--muted) }
.tag { font: 500 12px/1.4 var(--f-data); padding: 1px 6px; border-radius: 5px; background: var(--sunken); border: 1px solid var(--hair); color: var(--ink); text-decoration: none; white-space: nowrap }
a.tag:hover { border-color: var(--accent) }
.chip { font: 400 11.5px/1.5 var(--f-text); color: var(--ink-2); padding: 0 7px; border-radius: 99px; background: var(--sunken); white-space: nowrap }

/* breakdown */
.stack-wrap { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0 }
.stack { position: relative; display: flex; gap: 2px; height: 46px; margin-top: 20px }
.seg { min-width: 0; border: 0; padding: 0 8px; color: #fff; font: 500 12px/1.2 var(--f-text); text-align: left; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: flex; flex-direction: column; justify-content: center }
.seg:first-child { border-radius: 4px 0 0 4px }
.seg:last-of-type { border-radius: 0 4px 4px 0 }
.seg .v { font-family: var(--f-data); opacity: .9 }
.seg[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px }
.target-mark { position: absolute; top: -20px; bottom: -4px; width: 0; border-left: 2px dashed var(--ink) }
.target-mark span { position: absolute; top: -2px; right: 6px; font: 500 11px var(--f-data); color: var(--ink); white-space: nowrap }
.parts-table { width: 100%; border-collapse: collapse; font-size: 14px }
.parts-table th { text-align: left; font: 500 11px/1.3 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--hair-2) }
.parts-table td { padding: 7px 8px; border-bottom: 1px solid var(--hair); vertical-align: middle }
.parts-table td.num, .parts-table th.num { text-align: right }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px }
.link-btn { font: 500 13px var(--f-text); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px }

/* waterfall */
.variants { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.wf { width: 100%; height: auto; display: block }
.wf text { font: 12px var(--f-text); fill: var(--ink-2) }
.wf .val { font: 500 12px var(--f-data); fill: var(--ink) }
.wf .was { font: 11.5px var(--f-data); fill: var(--muted) }
.wf .tick { font: 11px var(--f-data); fill: var(--muted) }
.wf .row { cursor: pointer }
.wf .row:focus-visible { outline: none }
.wf .row:focus-visible .hl, .wf .row:hover .hl { fill: var(--sunken) }
.wf .row.on .hl { fill: var(--accent-soft) }
.basis { font: 500 11px/1.4 var(--f-data); color: var(--ink-2); border: 1px dashed var(--hair-2); border-radius: 4px; padding: 0 5px; white-space: nowrap }
.finding { font-size: 15px; color: var(--ink); max-width: 80ch }
.verdict { font-size: 17px; font-weight: 500; max-width: 68ch; text-wrap: pretty }
.against { font-size: 12.5px; color: var(--muted) }

/* nav */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--hair); display: flex; gap: 4px 18px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; margin-top: -20px }
.nav a { font: 500 13px var(--f-text); color: var(--ink-2); text-decoration: none; white-space: nowrap }
.nav a:hover { color: var(--accent) }
section { scroll-margin-top: 56px }

/* corrections, not measured */
.corr, .gaps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.corr li, .gaps li { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-width: 0 }
.corr .old { text-decoration: line-through; color: var(--muted) }
.corr .new { font-weight: 600 }
.corr .why, .gaps .why { color: var(--ink-2); font-size: 14px }

/* next up */
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px }
.lane { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.lane ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.lane li { display: grid; gap: 3px; padding-top: 10px; border-top: 1px solid var(--hair) }
.lane li:first-child { border-top: 0; padding-top: 0 }
.lane .row1 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.lane .hyp { color: var(--ink-2); font-size: 13.5px }
.prio { font: 500 12px var(--f-data); color: var(--muted); min-width: 22px }

/* ideas table */
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.fbtn { font: 500 13px/1 var(--f-text); padding: 7px 11px; border-radius: 99px; border: 1px solid var(--hair-2); background: var(--surface); color: var(--ink); cursor: pointer }
.fbtn .n { color: var(--muted); font-family: var(--f-data); font-size: 12px; margin-left: 4px }
.fbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.fbtn[aria-pressed="true"] .n { color: inherit; opacity: .75 }
select, input[type="search"] { font: 14px var(--f-text); color: var(--ink); background: var(--surface); border: 1px solid var(--hair-2); border-radius: 8px; padding: 6px 9px; min-width: 0 }
input[type="search"] { flex: 1 1 180px }
.showing { font-size: 13px; color: var(--muted) }
.table-wrap { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); overflow-x: auto }
.ideas { width: 100%; border-collapse: collapse; font-size: 14px }
.ideas th { text-align: left; font: 500 11px/1.3 var(--f-data); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--hair-2); white-space: nowrap }
.ideas td { padding: 11px 12px; border-bottom: 1px solid var(--hair); vertical-align: top }
.ideas tr:last-child td { border-bottom: 0 }
.ideas tr.flash td { background: var(--accent-soft) }
.ideas .t { font-weight: 600 }
.ideas .sub { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px }
.ideas .hyp { color: var(--ink-2); font-size: 13px; margin-top: 3px }
.res { display: grid; gap: 6px; font-size: 13px; min-width: 230px }
.res .mn { color: var(--muted); font-size: 12px }
.res .v { font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap }
.res .g, .res .note { white-space: nowrap }
.res .g { font-family: var(--f-data); font-size: 12px }
.res .better { color: var(--good-ink) }
.res .note { font-size: 11.5px; color: var(--muted) }
.res .bad { color: var(--critical); font-weight: 500; white-space: nowrap }
.links { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px }
.empty { padding: 24px; text-align: center; color: var(--muted) }
@media (max-width: 760px) {
  .ideas thead { display: none }
  .ideas, .ideas tbody, .ideas tr, .ideas td { display: block; width: 100% }
  .ideas tr { padding: 10px 12px; border-bottom: 1px solid var(--hair) }
  .ideas td { border: 0; padding: 3px 0 }
  .res { min-width: 0 }
}

/* revisions, reports */
.revs, .reports { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.revs li, .reports li { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-width: 0 }
.revs .why { color: var(--ink-2); font-size: 14px }
.reports li { grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline }
.reports .rid { font: 600 15px var(--f-data); color: var(--ink) }
.reports .rmeta { grid-column: 2; font-size: 13px; color: var(--muted) }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--hair); padding-top: 16px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="page" id="app"></div>

<script>
const CLIMB = /*DATA:climb*/null/*END:climb*/;
(function () {
  const app = document.getElementById('app')
  if (!CLIMB) { app.innerHTML = '<p class="empty">No ledger embedded. Run <code>climb-report.mjs build --dir &lt;climb folder&gt;</code>.</p>'; return }
  const V = CLIMB
  const NS = 'http://www.w3.org/2000/svg'
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const metricsById = Object.fromEntries(V.metrics.map(m => [m.id, m]))
  const reportsById = Object.fromEntries(V.reports.map(r => [r.id, r]))
  const exps = Object.fromEntries(V.experiments.map(e => [e.id, e]))
  const parts = {}
  // A part's colour follows its group when the breakdown has groups (fixed order of first appearance), else the part itself.
  V.breakdowns.forEach(b => {
    const groups = [...new Set(b.parts.map(p => p.group).filter(Boolean))]
    b.groups = groups
    b.parts.forEach((p, i) => { parts[p.id] = { ...p, color: `var(--s${((groups.length ? groups.indexOf(p.group) : i) % 8) + 1})`, breakdown: b.id } })
  })
  const BASIS_NOTE = { derived: 'derived', simulated: 'simulated', assumed: 'assumed' }
  const basisTag = (basis, against) => BASIS_NOTE[basis] ? ` <span class="basis"${against ? ` title="${esc(against)}"` : ''}>${BASIS_NOTE[basis]}</span>` : ''
  const STATUS = { kept: ['✓', 'Kept'], rejected: ['✕', 'Rejected'], parked: ['❙❙', 'Parked'], running: ['●', 'Running'], backlog: ['○', 'Backlog'] }
  const STANDING = { target: ['✓', 'Target met'], floor: ['!', 'Above floor'], below: ['✕', 'Below floor'], none: ['–', 'Not measured'] }

  function fmt (v, m = {}, unit = true) {
    if (v === null || v === undefined) return '–'
    const d = m.decimals ?? (Math.abs(v) >= 100 ? 0 : Math.abs(v) >= 10 ? 1 : 2)
    const t = Number(v.toFixed(d)).toLocaleString('en-US', { maximumFractionDigits: d })
    return unit && m.unit ? `${t} ${m.unit}` : t
  }
  const signed = (v, m) => (v > 0 ? '+' : v < 0 ? '−' : '±') + fmt(Math.abs(v), m)
  // Turn E7 and R3 in any text into links: to the idea's row, or to the report.
  function linkify (text) {
    return esc(text).replace(/\b([ER])(\d+)\b/g, (all, k, n) => {
      const id = k + n
      if (k === 'E' && exps[id]) return `<a href="#${id}" class="ref" data-exp="${id}">${id}</a>`
      if (k === 'R' && reportsById[id]) return `<a href="${esc(reportsById[id].href)}" target="_blank" rel="noopener">${id}</a>`
      return all
    })
  }
  const pill = (cls, [icon, label]) => `<span class="pill ${cls}"><i aria-hidden="true">${icon}</i>${label}</span>`
  const el = (tag, attrs = {}, html = '') => { const n = document.createElement(tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); n.innerHTML = html; return n }
  const svg = (tag, attrs = {}) => { const n = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); return n }
  const better = m => m.better === 'lower' ? 'lower is better' : 'higher is better'

  /* ---------- header ---------- */
  const budget = V.budget ? [
    V.budget.experiments ? `<span><b>Budget</b> ${V.counts.decided} of ${V.budget.experiments} experiments</span>` : '',
    V.budget.until ? `<span><b>Until</b> ${esc(V.budget.until)}</span>` : '',
    V.budget.plateau ? `<span><b>Plateau</b> after ${V.budget.plateau}</span>` : ''
  ].join('') : ''
  const top = el('header', { class: 'top' }, `
    <div class="eyebrow"><span>Hill climb${V.issue ? ` · ${V.issue.url ? `<a href="${esc(V.issue.url)}" target="_blank" rel="noopener">#${V.issue.n}</a>` : '#' + V.issue.n}` : ''}</span><span class="phase">${esc(V.phase)}</span></div>
    <h1>${esc(V.title)}</h1>
    ${V.summary ? `<p class="summary">${linkify(V.summary)}</p>` : ''}
    ${V.verdict ? `<p class="verdict">${linkify(V.verdict)}</p>` : ''}
    <div class="meta">
      <span><b>Updated</b> ${esc(V.updated)}</span>
      ${V.branch ? `<span><b>Branch</b> ${V.branch.url ? `<a href="${esc(V.branch.url)}" target="_blank" rel="noopener">${esc(V.branch.name)}</a>` : esc(V.branch.name)}</span>` : ''}
      ${V.plan ? `<span><a href="${esc(V.plan)}" target="_blank" rel="noopener">Plan and criteria</a></span>` : ''}
      ${V.ledger ? `<span><a href="${esc(V.ledger)}" target="_blank" rel="noopener">Ledger</a></span>` : ''}
      ${budget}
    </div>`)
  app.append(top)

  const open = V.human.filter(h => h.status !== 'done')
  if (V.waiting.length || open.length || V.resources.length) {
    const box = (title, items) => items.length ? `<div class="callout"><span class="label">${title}</span><ul>${items.join('')}</ul></div>` : ''
    top.append(el('div', { class: 'attention' },
      box('Waiting on', V.waiting.map(w => `<li><b>${esc(w.who)}</b>: ${linkify(w.what)}${w.link ? ` (<a href="${esc(w.link)}" target="_blank" rel="noopener">where</a>)` : ''}</li>`)) +
      box('Needs a person', open.map(h => `<li>${h.link ? `<a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.what)}</a>` : esc(h.what)}</li>`)) +
      box('Held right now', V.resources.map(r => `<li>${esc(r.name)}: ${linkify(r.holder)}${r.since ? ` <span class="muted">since ${esc(r.since)}</span>` : ''}</li>`))))
  }

  /* ---------- charts ---------- */
  function domain (m, pts, extra = []) {
    const vals = [...pts.flatMap(p => [p.value, ...(p.ci || [])]), m.target, ...(typeof m.floor === 'number' ? [m.floor] : []), ...extra]
    let lo = Math.min(...vals), hi = Math.max(...vals)
    if (lo === hi) { lo -= 1; hi += 1 }
    const pad = (hi - lo) * 0.08
    return [lo - pad, hi + pad]
  }
  function ticks (lo, hi, count = 4) {
    const step0 = (hi - lo) / count, mag = 10 ** Math.floor(Math.log10(step0))
    const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= step0)
    const out = []
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(Number(v.toFixed(10)))
    return out
  }
  function keptPath (pts, X, Y) {
    let d = ''
    pts.forEach((p, i) => { d += i ? ` H${X(p.x)} V${Y(p.value)}` : `M${X(p.x)} ${Y(p.value)}` })
    return d
  }

  function sparkline (m) {
    const pts = m.points.filter(p => p.status === 'kept' && !p.holdout)
    const W = 240, H = 46, s = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'spark', preserveAspectRatio: 'none', 'aria-hidden': 'true' })
    if (!pts.length) return s
    const [lo, hi] = domain(m, pts)
    const n = Math.max(1, V.order.length - 1)
    const X = x => 4 + (x / n) * (W - 8), Y = v => H - 4 - ((v - lo) / (hi - lo)) * (H - 8)
    s.append(svg('line', { x1: 0, x2: W, y1: Y(m.target), y2: Y(m.target), stroke: 'var(--good)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4', 'vector-effect': 'non-scaling-stroke' }))
    s.append(svg('path', { d: keptPath(pts, X, Y) + ` H${X(n)}`, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke' }))
    return s
  }

  function bigChart (m, wrap) {
    const pts = m.points
    const W = 760, H = 280, L = 58, R = 150, T = 16, B = 36
    const refVals = m.references.map(r => r.value)
    const [lo, hi] = domain(m, pts, refVals)
    const n = Math.max(1, V.order.length - 1)
    const X = x => L + (x / n) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B)
    const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': `${m.name} over the experiments` })
    // grid and y axis
    ticks(lo, hi).forEach(v => {
      s.append(svg('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: 'var(--hair)', 'stroke-width': 1 }))
      const t = svg('text', { x: L - 8, y: Y(v) + 4, 'text-anchor': 'end' }); t.textContent = fmt(v, m, false); s.append(t)
    })
    // noise band around the current value
    if (m.current && m.noise) {
      s.append(svg('rect', { x: L, width: W - L - R, y: Y(Math.min(hi, m.current.value + m.noise)), height: Math.abs(Y(m.current.value - m.noise) - Y(m.current.value + m.noise)), fill: 'var(--accent-soft)' }))
    }
    // reference lines, labelled at the right edge
    const labels = []
    const hline = (v, stroke, dash, text) => {
      s.append(svg('line', { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke, 'stroke-width': 1.5, 'stroke-dasharray': dash }))
      labels.push({ y: Y(v), text })
    }
    hline(m.target, 'var(--good)', '6 4', `Target ${fmt(m.target, m)}`)
    if (typeof m.floor === 'number') hline(m.floor, 'var(--muted)', '2 3', `Floor ${fmt(m.floor, m)}`)
    m.references.forEach(r => {
      const name = r.label.split(/[,(]/)[0].trim()
      hline(r.value, 'var(--ink-2)', '8 3 2 3', `${name.length > 13 ? name.slice(0, 12) + '…' : name} ${fmt(r.value, m, false)}`)
    })
    labels.sort((a, b) => a.y - b.y).forEach((l, i, all) => { if (i && l.y - all[i - 1].y < 13) l.y = all[i - 1].y + 13 })
    labels.forEach(l => { const t = svg('text', { x: W - R + 8, y: l.y + 4, class: 'lbl' }); t.textContent = l.text; s.append(t) })
    // revisions of the criteria
    m.revisions.forEach(r => {
      const x = X(Math.max(0, r.x - 0.5))
      s.append(svg('line', { x1: x, x2: x, y1: T, y2: H - B, stroke: 'var(--hair-2)', 'stroke-width': 1.5, 'stroke-dasharray': '3 3' }))
      const t = svg('text', { x: x + 4, y: T + 10 }); t.textContent = `Rev ${r.rev}`; s.append(t)
    })
    // x axis: experiment ids at their points
    const every = Math.ceil(V.order.length / 14)
    V.order.forEach((id, x) => {
      if (x % every && x !== V.order.length - 1) return
      const t = svg('text', { x: X(x), y: H - B + 18, 'text-anchor': 'middle' }); t.textContent = id; s.append(t)
    })
    // CI whiskers
    pts.filter(p => p.ci).forEach(p => s.append(svg('line', { x1: X(p.x), x2: X(p.x), y1: Y(p.ci[0]), y2: Y(p.ci[1]), stroke: p.holdout ? 'var(--holdout)' : p.status === 'kept' ? 'var(--accent)' : 'var(--muted)', 'stroke-width': 1.5, opacity: .55 })))
    // kept line: the current value over time
    const kept = pts.filter(p => p.status === 'kept' && !p.holdout)
    if (kept.length) s.append(svg('path', { d: keptPath(kept, X, Y) + ` H${X(n)}`, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 }))
    // points
    pts.forEach(p => {
      const x = X(p.x), y = Y(p.value)
      let mark
      if (p.holdout) mark = svg('path', { d: `M${x} ${y - 6} L${x + 6} ${y} L${x} ${y + 6} L${x - 6} ${y} Z`, fill: 'var(--holdout)', stroke: 'var(--surface)', 'stroke-width': 2 })
      else if (p.status === 'kept') mark = svg('circle', { cx: x, cy: y, r: 5, fill: 'var(--accent)', stroke: 'var(--surface)', 'stroke-width': 2 })
      else mark = svg('circle', { cx: x, cy: y, r: 4.5, fill: 'var(--surface)', stroke: p.status === 'parked' ? 'var(--warn)' : 'var(--muted)', 'stroke-width': 2 })
      s.append(mark)
    })
    // hover and click targets, bigger than the marks
    const tip = el('div', { class: 'tip', hidden: '' })
    pts.forEach(p => {
      const hit = svg('circle', { cx: X(p.x), cy: Y(p.value), r: 13, fill: 'transparent', tabindex: 0, style: 'cursor:pointer' })
      const show = () => {
        tip.innerHTML = `<b>${esc(p.id)}</b> ${esc(p.title)}<br>${STATUS[p.status][1]}${p.holdout ? ` · ${esc(p.split)}` : ''}${p.basis !== 'measured' ? ` · ${esc(p.basis)}` : ''} · ${fmt(p.value, m)}${p.ci ? ` [${fmt(p.ci[0], m, false)}–${fmt(p.ci[1], m, false)}]` : ''}${p.n !== null ? ` · n ${p.n}` : ''}`
        tip.hidden = false
        const box = wrap.getBoundingClientRect(), r = hit.getBoundingClientRect()
        tip.style.left = Math.min(r.left - box.left + wrap.scrollLeft + 14, wrap.clientWidth - 290 + wrap.scrollLeft) + 'px'
        tip.style.top = (r.top - box.top - 8) + 'px'
      }
      hit.addEventListener('mouseenter', show); hit.addEventListener('focus', show)
      hit.addEventListener('mouseleave', () => { tip.hidden = true }); hit.addEventListener('blur', () => { tip.hidden = true })
      hit.addEventListener('click', () => jumpTo(p.id))
      hit.addEventListener('keydown', e => { if (e.key === 'Enter') jumpTo(p.id) })
      s.append(hit)
    })
    wrap.append(s, tip)
  }

  const key = (shape) => {
    const s = svg('svg', { width: 22, height: 12, 'aria-hidden': 'true' })
    if (shape === 'kept') { s.append(svg('line', { x1: 0, x2: 22, y1: 6, y2: 6, stroke: 'var(--accent)', 'stroke-width': 2 })); s.append(svg('circle', { cx: 11, cy: 6, r: 4, fill: 'var(--accent)' })) }
    if (shape === 'rejected') s.append(svg('circle', { cx: 11, cy: 6, r: 4, fill: 'var(--surface)', stroke: 'var(--muted)', 'stroke-width': 2 }))
    if (shape === 'parked') s.append(svg('circle', { cx: 11, cy: 6, r: 4, fill: 'var(--surface)', stroke: 'var(--warn)', 'stroke-width': 2 }))
    if (shape === 'holdout') s.append(svg('path', { d: 'M11 1 L16 6 L11 11 L6 6 Z', fill: 'var(--holdout)' }))
    if (shape === 'target') s.append(svg('line', { x1: 0, x2: 22, y1: 6, y2: 6, stroke: 'var(--good)', 'stroke-width': 1.5, 'stroke-dasharray': '6 4' }))
    if (shape === 'floor') s.append(svg('line', { x1: 0, x2: 22, y1: 6, y2: 6, stroke: 'var(--muted)', 'stroke-width': 1.5, 'stroke-dasharray': '2 3' }))
    if (shape === 'ref') s.append(svg('line', { x1: 0, x2: 22, y1: 6, y2: 6, stroke: 'var(--ink-2)', 'stroke-width': 1.5, 'stroke-dasharray': '8 3 2 3' }))
    if (shape === 'noise') s.append(svg('rect', { x: 0, y: 1, width: 22, height: 10, fill: 'var(--accent-soft)' }))
    return s.outerHTML
  }

  /* ---------- scoreboard ---------- */
  const order = { primary: 0, secondary: 1, guard: 2 }
  const metrics = [...V.metrics].sort((a, b) => (order[a.role] ?? 3) - (order[b.role] ?? 3))
  const score = el('section', { id: 'scoreboard', 'data-nav': 'Standing', 'aria-labelledby': 'h-score' }, `<div class="section-head"><h2 id="h-score">Where it stands</h2></div>`)
  const cards = el('div', { class: 'cards' })
  const panels = el('div', { class: 'panels' })
  metrics.forEach(m => {
    const d = m.baseline && m.current ? m.current.value - m.baseline.value : null
    const card = el('article', { class: `metric ${m.role}` }, `
      <div class="m-head"><span class="role">${esc(m.role)}</span>${pill(m.standing, STANDING[m.standing])}</div>
      <h3>${esc(m.name)}</h3>
      <div class="big">${m.current ? fmt(m.current.value, m, false) : '–'}<span class="unit">${esc(m.unit)}</span></div>
      <div class="delta">${m.current ? `<a href="#${m.current.id}" class="ref" data-exp="${m.current.id}">${m.current.id}</a>` : 'No kept result yet'}${d !== null ? ` · ${signed(d, m)} vs baseline` : ''}${m.current ? basisTag(m.current.basis, m.current.against) : ''}</div>
      <dl class="refs">
        <div><dt>Baseline</dt><dd>${m.baseline ? fmt(m.baseline.value, m, false) : '–'}</dd></div>
        <div><dt>Target</dt><dd>${fmt(m.target, m, false)}</dd></div>
        <div><dt>Floor</dt><dd>${typeof m.floor === 'number' ? fmt(m.floor, m, false) : '–'}</dd></div>
        <div><dt>Noise</dt><dd>${m.noise ? '±' + fmt(m.noise, m, false) : '–'}</dd></div>
        ${m.holdout ? `<div><dt>${esc(m.holdout.split)}</dt><dd>${fmt(m.holdout.value, m, false)} <a href="#${m.holdout.id}" class="ref" data-exp="${m.holdout.id}">${m.holdout.id}</a></dd></div>` : ''}
        ${m.references.map(r => `<div><dt>${esc(r.label.split(/[,(]/)[0].trim())}</dt><dd>${fmt(r.value, m, false)}</dd></div>`).join('')}
      </dl>`)
    card.append(sparkline(m))
    const btn = el('button', { class: 'chart-btn', type: 'button', 'aria-expanded': 'false', 'aria-controls': `chart-${m.id}` },
      `<span>Chart</span><span><span class="count">${m.points.length} result${m.points.length === 1 ? '' : 's'}</span> <span class="chev" aria-hidden="true">▾</span></span>`)
    card.append(btn)
    cards.append(card)

    const panel = el('div', { class: 'panel', id: `chart-${m.id}`, hidden: '' }, `
      <div class="section-head"><h3>${esc(m.name)} <span class="muted">(${esc(m.unit || 'value')}, ${better(m)})</span></h3></div>
      ${m.finding ? `<p class="finding">${linkify(m.finding)}</p>` : ''}
      <p class="how"><b>How it's measured:</b> ${linkify(m.how)}${m.against ? ` <span class="against">Against: ${esc(m.against)}.</span>` : ''}</p>
      <div class="legend">
        <span>${key('kept')}Kept</span><span>${key('rejected')}Rejected</span><span>${key('parked')}Parked</span>
        ${m.points.some(p => p.holdout) ? `<span>${key('holdout')}Holdout</span>` : ''}
        <span>${key('target')}Target</span>${typeof m.floor === 'number' ? `<span>${key('floor')}Floor</span>` : ''}
        ${m.references.length ? `<span>${key('ref')}Reference</span>` : ''}${m.noise ? `<span>${key('noise')}Noise band</span>` : ''}
      </div>`)
    const wrap = el('div', { class: 'chart-wrap' })
    panel.append(wrap)
    if (m.points.length < 2) panel.append(el('p', { class: 'muted' }, m.points.length ? 'One measurement so far.' : 'No measurements yet.'))
    panel.append(el('details', { class: 'table-view' }, `<summary>Table view</summary><table class="mini"><thead><tr><th>Experiment</th><th>Outcome</th><th class="num">Value</th><th class="num">CI</th><th class="num">n</th></tr></thead><tbody>${m.points.map(p => `<tr><td><a href="#${p.id}" class="ref" data-exp="${p.id}">${p.id}</a> ${esc(p.title)}</td><td>${STATUS[p.status][1]}${p.holdout ? ` (${esc(p.split)})` : ''}</td><td class="num">${fmt(p.value, m, false)}</td><td class="num">${p.ci ? `${fmt(p.ci[0], m, false)}–${fmt(p.ci[1], m, false)}` : '–'}</td><td class="num">${p.n ?? '–'}</td></tr>`).join('')}</tbody></table>`))
    panels.append(panel)
    let drawn = false
    btn.addEventListener('click', () => {
      const openNow = btn.getAttribute('aria-expanded') !== 'true'
      btn.setAttribute('aria-expanded', String(openNow))
      btn.firstElementChild.textContent = openNow ? 'Hide chart' : 'Chart'
      panel.hidden = !openNow
      if (openNow && !drawn) { bigChart(m, wrap); drawn = true }
    })
  })
  score.append(cards, panels)
  app.append(score)

  /* ---------- breakdowns ---------- */
  const filter = { status: 'all', area: '', part: '', metric: '', q: '', sort: 'newest' }
  const redrawParts = []
  let lastWidth = 0
  addEventListener('resize', () => { if (Math.abs(innerWidth - lastWidth) > 40) { lastWidth = innerWidth; redrawParts.forEach(f => f()) } })
  V.breakdowns.forEach(b => {
    const m = metricsById[b.metric] || {}
    const unitM = { unit: b.unit ?? m.unit, decimals: m.decimals }
    let vsel = b.variants.length ? b.variants[0].id : 'all'
    const sec = el('section', { id: `breakdown-${b.id}`, 'data-nav': b.title, 'aria-labelledby': `h-${b.id}` }, `<div class="section-head"><h2 id="h-${b.id}">${esc(b.title)}</h2></div>${b.finding ? `<p class="finding">${linkify(b.finding)}</p>` : ''}${b.note ? `<p class="muted" style="font-size:13.5px;max-width:80ch">${linkify(b.note)}</p>` : ''}`)
    const box = el('div', { class: 'stack-wrap' })
    const controls = el('div', { class: 'variants', role: 'group', 'aria-label': 'Variant' })
    b.variants.forEach(v => {
      const btn = el('button', { class: 'fbtn', type: 'button', 'aria-pressed': String(v.id === vsel) }, esc(v.label))
      btn.addEventListener('click', () => { vsel = v.id; controls.querySelectorAll('.fbtn').forEach(x => x.setAttribute('aria-pressed', String(x === btn))); draw() })
      controls.append(btn)
    })
    const chart = el('div', { class: 'chart-wrap' })
    const legend = el('div', { class: 'legend' })
    const tableBox = el('div', { style: 'overflow-x:auto' })
    if (b.variants.length) box.append(controls)
    box.append(chart, legend, tableBox)
    sec.append(box)
    app.append(sec)
    const tip = el('div', { class: 'tip', hidden: '' })

    // Fill by how the number was obtained: solid measured, hatched derived, dotted simulated, dashed outline assumed.
    // Pattern ids carry a prefix, so the legend's swatches never pick up the chart's patterns by id.
    function defs (s, prefix = b.id, colours = [...new Set(b.parts.map(p => parts[p.id].color))]) {
      const d = svg('defs')
      colours.forEach((col, i) => {
        const h = svg('pattern', { id: `${prefix}-h${i}`, width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' })
        h.append(svg('rect', { width: 6, height: 6, fill: col, 'fill-opacity': 0.25 }), svg('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: col, 'stroke-width': 2.5 }))
        const o = svg('pattern', { id: `${prefix}-d${i}`, width: 5, height: 5, patternUnits: 'userSpaceOnUse' })
        o.append(svg('rect', { width: 5, height: 5, fill: col, 'fill-opacity': 0.2 }), svg('circle', { cx: 2.5, cy: 2.5, r: 1.3, fill: col }))
        d.append(h, o)
      })
      s.append(d)
      return col => `${prefix}-${colours.indexOf(col)}`
    }
    const fillFor = (idx, col, basis) => {
      const [prefix, i] = idx(col).split(/-(?=\d+$)/)
      if (basis === 'derived') return { fill: `url(#${prefix}-h${i})`, stroke: col, 'stroke-width': 1 }
      if (basis === 'simulated') return { fill: `url(#${prefix}-d${i})`, stroke: col, 'stroke-width': 1 }
      if (basis === 'assumed') return { fill: 'none', stroke: col, 'stroke-width': 1.5, 'stroke-dasharray': '4 3' }
      return { fill: col }
    }
    const showTip = (target, html) => {
      tip.innerHTML = html
      tip.hidden = false
      const bx = chart.getBoundingClientRect(), r = target.getBoundingClientRect()
      tip.style.left = Math.max(0, Math.min(r.left - bx.left + chart.scrollLeft + 12, chart.clientWidth - 290 + chart.scrollLeft)) + 'px'
      tip.style.top = (r.top - bx.top - 10) + 'px'
    }
    // A value label, with the baseline beside it in a quieter span.
    const valueText = (x, y, text, was) => {
      const t = svg('text', { x, y })
      const a = svg('tspan', { class: 'val' }); a.textContent = text; t.append(a)
      if (was) { const w = svg('tspan', { class: 'was', dx: 8 }); w.textContent = was; t.append(w) }
      return t
    }
    const range = x => x.range ? `${fmt(x.range[0], unitM, false)}–${fmt(x.range[1], unitM)}` : null
    const partTip = (p, x) => `<b>${esc(p.label)}</b>${p.group ? ` · ${esc(p.group)}` : ''}<br>${fmt(x.value, unitM)}${range(x) ? ` (${range(x)})` : ''} · ${esc(p.basis)}${x.baseline !== null ? `<br>Baseline ${fmt(x.baseline, unitM)}` : ''}${p.against ? `<br>${esc(p.against)}` : ''}${p.source ? `<br>${esc(p.source)}` : ''}<br>${p.tried} tried, ${p.kept} kept, ${p.queued} queued`

    function waterfall () {
      const total = b.totals[vsel]
      const W = Math.max(340, Math.round(chart.clientWidth || 760))
      const narrow = W < 640
      const LW = narrow ? 0 : 210, R = narrow ? 92 : 150, rowH = narrow ? 44 : 32, barH = 18, top = 26
      const x0 = LW + 8, x1 = W - R
      const scaleMax = (() => {
        const hi = Math.max(total.hi, total.baseline ?? 0, b.target ?? 0, total.value)
        const step = [1, 2, 2.5, 5].map(f => f * 10 ** Math.floor(Math.log10(hi / 5))).find(st => hi / st <= 6) ?? 10 ** Math.ceil(Math.log10(hi / 5))
        return Math.ceil(hi / step) * step
      })()
      const X = v => x0 + (v / scaleMax) * (x1 - x0)
      const rows = b.parts.length + 1
      const H = top + rows * rowH + 34
      const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'wf', role: 'img', 'aria-label': `${b.title}: ${fmt(total.value, unitM)} in all` })
      const idx = defs(s)
      // grid
      const step = scaleMax / 5
      for (let t = 0; t <= scaleMax + 1e-9; t += step) {
        s.append(svg('line', { x1: X(t), x2: X(t), y1: top - 6, y2: H - 28, stroke: 'var(--hair)', 'stroke-width': 1 }))
        const tx = svg('text', { x: X(t), y: H - 10, 'text-anchor': 'middle', class: 'tick' }); tx.textContent = fmt(t, unitM, false); s.append(tx)
      }
      let run = 0
      b.parts.forEach((p, i) => {
        const x = p.values[vsel]
        const y = top + i * rowH, by = y + (narrow ? 20 : (rowH - barH) / 2)
        const col = parts[p.id].color
        const g = svg('g', { class: `row${filter.part === p.id ? ' on' : ''}`, tabindex: 0, role: 'button', 'aria-label': `${p.label}: ${fmt(x.value, unitM)}. Show the ideas aimed at it.` })
        g.append(svg('rect', { class: 'hl', x: 0, y, width: W, height: rowH, fill: 'transparent', rx: 4 }))
        const lab = svg('text', { x: narrow ? x0 : 4, y: narrow ? y + 14 : by + 13 }); lab.textContent = p.label; g.append(lab)
        if (x.baseline !== null && x.baseline !== x.value) g.append(svg('rect', { x: X(run), y: by - 3, width: Math.max(1, X(run + x.baseline) - X(run)), height: barH + 6, rx: 3, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 1, 'stroke-dasharray': '3 2' }))
        g.append(svg('rect', { x: X(run), y: by, width: Math.max(2, X(run + x.value) - X(run)), height: barH, rx: 2, ...fillFor(idx, col, p.basis) }))
        if (x.range) g.append(svg('line', { x1: X(run + x.range[0]), x2: X(run + x.range[1]), y1: by + barH / 2, y2: by + barH / 2, stroke: 'var(--ink)', 'stroke-width': 2 }))
        const end = Math.max(run + x.value, x.range ? run + x.range[1] : 0, x.baseline !== null ? run + x.baseline : 0)
        run += x.value
        g.append(valueText(X(end) + 6, by + 13, `+${fmt(x.value, unitM, false)} → ${fmt(run, unitM, false)}`, x.baseline !== null && x.baseline !== x.value && !narrow ? `was ${fmt(x.baseline, unitM, false)}` : null))
        const pick = () => setPart(filter.part === p.id ? '' : p.id)
        g.addEventListener('click', pick)
        g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick() } })
        g.addEventListener('mouseenter', () => showTip(g.lastChild, partTip(p, x)))
        g.addEventListener('focus', () => showTip(g.lastChild, partTip(p, x)))
        g.addEventListener('mouseleave', () => { tip.hidden = true })
        g.addEventListener('blur', () => { tip.hidden = true })
        s.append(g)
      })
      // total
      const y = top + b.parts.length * rowH, by = y + (narrow ? 20 : (rowH - barH) / 2)
      const tl = svg('text', { x: narrow ? x0 : 4, y: narrow ? y + 14 : by + 13, 'font-weight': 600 }); tl.textContent = 'Total'; s.append(tl)
      if (total.baseline !== null && total.baseline !== total.value) s.append(svg('rect', { x: X(0), y: by - 3, width: X(total.baseline) - X(0), height: barH + 6, rx: 3, fill: 'none', stroke: 'var(--muted)', 'stroke-width': 1, 'stroke-dasharray': '3 2' }))
      s.append(svg('rect', { x: X(0), y: by, width: X(total.value) - X(0), height: barH, rx: 3, fill: 'var(--ink)', 'fill-opacity': 0.82 }))
      if (total.lo !== total.hi) s.append(svg('line', { x1: X(total.lo), x2: X(total.hi), y1: by + barH / 2, y2: by + barH / 2, stroke: 'var(--surface)', 'stroke-width': 2 }))
      const tend = Math.max(total.value, total.hi, total.baseline ?? 0)
      s.append(valueText(X(tend) + 6, by + 13, `= ${fmt(total.value, unitM)}`, total.baseline !== null && total.baseline !== total.value && !narrow ? `was ${fmt(total.baseline, unitM, false)}` : null))
      // target
      if (b.target) {
        s.append(svg('line', { x1: X(b.target), x2: X(b.target), y1: top - 10, y2: H - 28, stroke: 'var(--good)', 'stroke-width': 2, 'stroke-dasharray': '6 4' }))
        const t = svg('text', { x: X(b.target), y: top - 14, 'text-anchor': 'middle', class: 'val' }); t.textContent = `Target ${fmt(b.target, unitM)}`; s.append(t)
      }
      chart.replaceChildren(s, tip)
    }

    function shareBar () {
      const total = b.totals[vsel]
      const scale = Math.max(total.value, b.target ?? 0)
      const stack = el('div', { class: 'stack', role: 'group', 'aria-label': `${b.title}: ${fmt(total.value, unitM)} in all` })
      b.parts.forEach(p => {
        const x = p.values[vsel]
        const seg = el('button', { class: 'seg', type: 'button', 'aria-pressed': String(filter.part === p.id), 'data-part': p.id, title: `${p.label}: ${fmt(x.value, unitM)} (${Math.round(x.share * 100)} %)`, style: `flex: ${x.value} 1 0; background: ${parts[p.id].color}` },
          `<span>${esc(p.label)}</span><span class="v">${fmt(x.value, unitM, false)}</span>`)
        seg.addEventListener('click', () => setPart(filter.part === p.id ? '' : p.id))
        stack.append(seg)
      })
      if (scale > total.value) stack.append(el('div', { style: `flex: ${scale - total.value} 1 0` }))
      if (b.target) stack.append(el('div', { class: 'target-mark', style: `left: calc(${(b.target / scale) * 100}% - 1px)` }, `<span>Target ${fmt(b.target, unitM)}</span>`))
      chart.replaceChildren(stack)
    }

    function table () {
      const total = b.totals[vsel]
      const hasBase = total.baseline !== null
      tableBox.innerHTML = `<table class="parts-table"><thead><tr><th>Part</th><th class="num">Now</th>${hasBase ? '<th class="num">Baseline</th>' : ''}<th class="num">Share</th><th class="num">Tried</th><th class="num">Kept</th><th class="num">Queued</th><th></th></tr></thead><tbody>${b.parts.map(p => {
        const x = p.values[vsel]
        return `<tr><td><span class="sw" style="background:${parts[p.id].color}"></span>${esc(p.label)}${basisTag(p.basis, p.against)}${p.from ? ` <span class="muted">(${linkify(p.from)})</span>` : ''}</td><td class="num">${fmt(x.value, unitM)}${x.range ? `<br><span class="muted">${range(x)}</span>` : ''}</td>${hasBase ? `<td class="num">${fmt(x.baseline, unitM)}</td>` : ''}<td class="num">${Math.round(x.share * 100)} %</td><td class="num">${p.tried}</td><td class="num">${p.kept}</td><td class="num">${p.queued}</td><td><button type="button" class="link-btn" data-part="${p.id}">Show ideas</button></td></tr>`
      }).join('')}<tr><td><b>Total</b></td><td class="num"><b>${fmt(total.value, unitM)}</b></td>${hasBase ? `<td class="num">${fmt(total.baseline, unitM)}</td>` : ''}<td class="num">100 %</td><td colspan="4"></td></tr></tbody></table>`
      tableBox.querySelectorAll('.link-btn').forEach(x => x.addEventListener('click', () => { setPart(x.dataset.part); jumpTo('ideas') }))
      bindRefs(tableBox)
    }

    function legendHtml () {
      const sw = (basis, col = 'var(--ink-2)') => {
        const t = svg('svg', { width: 26, height: 12, 'aria-hidden': 'true' })
        const idx = defs(t, `${b.id}-key-${basis}`, [col])
        t.append(svg('rect', { x: 1, y: 1, width: 24, height: 10, rx: 2, ...fillFor(idx, col, basis) }))
        return t.outerHTML
      }
      const used = [...new Set(b.parts.map(p => p.basis))]
      const items = []
      if (b.groups.length) b.groups.forEach(g => items.push(`<span><span class="sw" style="background:${parts[b.parts.find(p => p.group === g).id].color}"></span>${esc(g)}</span>`))
      if (b.kind === 'stack') {
        const col = 'var(--ink-2)'
        if (used.length > 1 || used[0] !== 'measured') {
          for (const x of ['measured', 'derived', 'simulated', 'assumed']) if (used.includes(x)) items.push(`<span>${sw(x, col)}${x}</span>`)
        }
        if (b.parts.some(p => Object.values(p.values).some(x => x.baseline !== null))) items.push(`<span><svg width="26" height="12" aria-hidden="true"><rect x="1" y="1" width="24" height="10" rx="2" fill="none" stroke="var(--muted)" stroke-dasharray="3 2"></rect></svg>baseline</span>`)
        if (b.parts.some(p => Object.values(p.values).some(x => x.range))) items.push(`<span><svg width="26" height="12" aria-hidden="true"><line x1="2" x2="24" y1="6" y2="6" stroke="var(--ink)" stroke-width="2"></line></svg>range</span>`)
        if (b.target) items.push(`<span>${key('target')}target</span>`)
      }
      legend.innerHTML = items.join('')
    }

    function draw () {
      tip.hidden = true
      if (b.kind === 'stack') waterfall(); else shareBar()
      table()
    }
    legendHtml()
    redrawParts.push(draw)
    requestAnimationFrame(draw)
    draw()
  })

  /* ---------- running and next up ---------- */
  const running = V.experiments.filter(e => e.status === 'running')
  const backlog = V.experiments.filter(e => e.status === 'backlog').sort((a, b) => (a.priority ?? 1e9) - (b.priority ?? 1e9))
  if (running.length || backlog.length) {
    const partChips = e => e.parts.map(p => `<span class="chip">${esc(parts[p]?.label ?? p)}</span>`).join('')
    const item = (e, lead) => `<li><div class="row1">${lead}<a href="#${e.id}" class="tag ref" data-exp="${e.id}">${e.id}</a><b>${esc(e.title)}</b>${partChips(e)}</div>${e.hypothesis ? `<div class="hyp">${linkify(e.hypothesis)}</div>` : ''}${e.links.length ? `<div class="links">${e.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div>` : ''}</li>`
    app.append(el('section', { id: 'next', 'data-nav': 'Next up', 'aria-labelledby': 'h-next' }, `<div class="section-head"><h2 id="h-next">Running and next up</h2></div>
      <div class="lanes">
        <div class="lane"><span class="label">Running (${running.length})</span>${running.length ? `<ol>${running.map(e => item(e, '')).join('')}</ol>` : '<p class="muted">Nothing running.</p>'}</div>
        <div class="lane"><span class="label">Next up (${backlog.length})</span>${backlog.length ? `<ol>${backlog.map((e, i) => item(e, `<span class="prio">${i + 1}.</span>`)).join('')}</ol>` : '<p class="muted">The backlog is empty.</p>'}</div>
      </div>`))
  }

  /* ---------- ideas tried ---------- */
  const areas = [...new Set(V.experiments.map(e => e.area).filter(Boolean))].sort()
  const counts = Object.fromEntries(Object.keys(STATUS).map(s => [s, V.experiments.filter(e => e.status === s).length]))
  const ideas = el('section', { id: 'ideas', 'data-nav': 'Ideas', 'aria-labelledby': 'h-ideas' }, `<div class="section-head"><h2 id="h-ideas">Ideas tried</h2></div>`)
  const filters = el('div', { class: 'filters' })
  const chips = el('div', { class: 'chips', role: 'group', 'aria-label': 'Outcome' })
  ;[['all', 'All', V.experiments.length], ...Object.keys(STATUS).filter(s => counts[s]).map(s => [s, STATUS[s][1], counts[s]])].forEach(([s, label, n]) => {
    const b = el('button', { class: 'fbtn', type: 'button', 'aria-pressed': String(s === 'all'), 'data-status': s }, `${label}<span class="n">${n}</span>`)
    b.addEventListener('click', () => { filter.status = s; chips.querySelectorAll('.fbtn').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render() })
    chips.append(b)
  })
  const select = (id, label, options) => {
    const s = el('select', { id, 'aria-label': label }, options.map(([v, t]) => `<option value="${esc(v)}">${esc(t)}</option>`).join(''))
    return s
  }
  const areaSel = select('f-area', 'Area', [['', 'Any area'], ...areas.map(a => [a, a])])
  const partSel = select('f-part', 'Part of the problem', [['', 'Any part'], ...Object.values(parts).map(p => [p.id, p.label])])
  const metricSel = select('f-metric', 'Measured on', [['', 'Any metric'], ...V.metrics.map(m => [m.id, m.short ?? m.name])])
  const sortSel = select('f-sort', 'Sort', [['newest', 'Newest first'], ['oldest', 'Oldest first'], ['gain', 'Biggest gain'], ['id', 'By number']])
  const search = el('input', { type: 'search', id: 'f-q', placeholder: 'Search ideas, decisions…', 'aria-label': 'Search ideas' })
  const showing = el('span', { class: 'showing', 'aria-live': 'polite' })
  const clear = el('button', { class: 'link-btn', type: 'button', hidden: '' }, 'Clear filters')
  if (!Object.keys(parts).length) partSel.hidden = true
  if (areas.length < 2) areaSel.hidden = true
  areaSel.addEventListener('change', () => { filter.area = areaSel.value; render() })
  partSel.addEventListener('change', () => setPart(partSel.value))
  metricSel.addEventListener('change', () => { filter.metric = metricSel.value; render() })
  sortSel.addEventListener('change', () => { filter.sort = sortSel.value; render() })
  search.addEventListener('input', () => { filter.q = search.value.trim().toLowerCase(); render() })
  clear.addEventListener('click', () => {
    Object.assign(filter, { status: 'all', area: '', part: '', metric: '', q: '' })
    areaSel.value = partSel.value = metricSel.value = search.value = ''
    chips.querySelectorAll('.fbtn').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.status === 'all')))
    setPart('')
  })
  filters.append(chips, areaSel, partSel, metricSel, sortSel, search, showing, clear)
  const tableWrap = el('div', { class: 'table-wrap' })
  const table = el('table', { class: 'ideas' }, '<thead><tr><th>Idea</th><th>Outcome</th><th>Result</th><th>Decision</th><th>Links</th></tr></thead>')
  const tbody = el('tbody')
  table.append(tbody); tableWrap.append(table)
  ideas.append(filters, tableWrap)
  app.append(ideas)

  function resultHtml (r) {
    const m = metricsById[r.metric] || r
    const val = r.was !== null ? `${fmt(r.was, m, false)} → ${fmt(r.value, m)}` : fmt(r.value, m)
    let g = ''
    if (r.gain !== null && !r.holdout) {
      const sign = r.gain > 0 ? 'better' : r.gain < 0 ? 'worse' : ''
      const delta = signed(r.value - r.was, m)
      g = `<span class="g ${r.gain > 0 && r.beyondNoise ? 'better' : ''}">${delta}</span> <span class="note">${r.beyondNoise ? sign : 'within noise'}</span>`
    }
    const belowFloor = m.role === 'guard' && typeof m.floor === 'number' && (m.better === 'lower' ? r.value > m.floor : r.value < m.floor)
    return `<div><span class="mn">${esc(m.short ?? m.name)}${r.holdout ? ` · ${esc(r.split)}` : ''}</span>${basisTag(r.basis, r.against)}<br><span class="v">${val}</span> ${g}${belowFloor ? ' <span class="bad">✕ below floor</span>' : ''}<br><span class="note">${r.ci ? `CI ${fmt(r.ci[0], m, false)}–${fmt(r.ci[1], m, false)}` : ''}${r.ci && r.n !== null ? ' · ' : ''}${r.n !== null ? `n ${r.n}` : ''}</span></div>`
  }

  function render () {
    let rows = V.experiments.filter(e =>
      (filter.status === 'all' || e.status === filter.status) &&
      (!filter.area || e.area === filter.area) &&
      (!filter.part || e.parts.includes(filter.part)) &&
      (!filter.metric || e.results.some(r => r.metric === filter.metric)) &&
      (!filter.q || [e.id, e.title, e.hypothesis, e.decision, e.area, ...e.parts.map(p => parts[p]?.label)].join(' ').toLowerCase().includes(filter.q)))
    // V.experiments is in order: decided by date, then running, then the backlog by priority.
    // Newest first shows what's running, then results newest first, then the backlog in priority order.
    const idx = Object.fromEntries(V.experiments.map((e, i) => [e.id, i]))
    const lane = e => e.status === 'running' ? 0 : e.status === 'backlog' ? 2 : 1
    const sorts = {
      newest: (a, b) => lane(a) - lane(b) || (lane(a) === 2 ? idx[a.id] - idx[b.id] : idx[b.id] - idx[a.id]),
      oldest: (a, b) => idx[a.id] - idx[b.id],
      gain: (a, b) => (b.gain ?? -Infinity) - (a.gain ?? -Infinity),
      id: (a, b) => Number(a.id.slice(1)) - Number(b.id.slice(1))
    }
    rows = [...rows].sort(sorts[filter.sort])
    tbody.innerHTML = rows.length ? rows.map(e => `<tr id="${e.id}">
      <td><span class="tag">${e.id}</span> <span class="t">${esc(e.title)}</span>
        <div class="sub">${e.area ? `<span class="chip">${esc(e.area)}</span>` : ''}${e.parts.map(p => parts[p]?.label ?? p).filter(label => label !== e.area).map(label => `<span class="chip">${esc(label)}</span>`).join('')}</div>
        ${e.hypothesis ? `<div class="hyp">${linkify(e.hypothesis)}</div>` : ''}</td>
      <td>${pill(e.status, STATUS[e.status])}${e.decided ? `<div class="muted" style="font-size:12px;margin-top:4px">${esc(e.decided)}</div>` : e.status === 'backlog' && e.priority ? `<div class="muted" style="font-size:12px;margin-top:4px">priority ${e.priority}</div>` : ''}</td>
      <td><div class="res">${e.results.map(resultHtml).join('') || '<span class="muted">–</span>'}</div></td>
      <td>${linkify(e.decision) || '<span class="muted">–</span>'}</td>
      <td><div class="links">${e.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}${e.reports.map(r => reportsById[r] ? `<a href="${esc(reportsById[r].href)}" target="_blank" rel="noopener">${r}</a>` : '').join('')}</div></td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty">No ideas match these filters.</td></tr>'
    const active = filter.status !== 'all' || filter.area || filter.part || filter.metric || filter.q
    showing.textContent = `Showing ${rows.length} of ${V.experiments.length}`
    clear.hidden = !active
    bindRefs(tbody)
  }

  function setPart (id) {
    filter.part = id
    partSel.value = id
    redrawParts.forEach(f => f())
    render()
  }

  function jumpTo (id) {
    if (exps[id] && !document.getElementById(id)) {
      // The row is filtered out: clear the filters so it can be shown.
      clear.click()
    }
    const target = document.getElementById(id)
    if (!target) return
    target.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' })
    if (target.tagName === 'TR') { target.classList.add('flash'); setTimeout(() => target.classList.remove('flash'), 1600) }
  }
  function bindRefs (root) {
    root.querySelectorAll('a.ref[data-exp]:not([data-bound])').forEach(a => {
      a.dataset.bound = '1'
      a.addEventListener('click', e => { e.preventDefault(); jumpTo(a.dataset.exp) })
    })
  }

  /* ---------- revisions ---------- */
  if (V.revisions.length) {
    app.append(el('section', { id: 'revisions', 'data-nav': 'Revisions', 'aria-labelledby': 'h-rev' }, `<div class="section-head"><h2 id="h-rev">Revisions to the criteria</h2></div>
      <ol class="revs">${[...V.revisions].reverse().map(r => `<li><div><span class="tag">Rev ${r.rev}</span> <span class="muted">${esc(r.date)}${r.who ? ' · ' + esc(r.who) : ''}${r.metrics ? ' · ' + r.metrics.map(id => esc(metricsById[id]?.short ?? metricsById[id]?.name ?? id)).join(', ') : ''}</span></div><div>${linkify(r.what)}</div><div class="why">Why: ${linkify(r.why)}${r.link ? ` (<a href="${esc(r.link)}" target="_blank" rel="noopener">where it was agreed</a>)` : ''}</div></li>`).join('')}</ol>`))
  }

  /* ---------- corrections ---------- */
  if (V.corrections.length) {
    app.append(el('section', { id: 'corrections', 'data-nav': 'Corrections', 'aria-labelledby': 'h-corr' }, `<div class="section-head"><h2 id="h-corr">Corrections</h2></div>
      <ol class="corr">${[...V.corrections].reverse().map(c => `<li><div><span class="muted">${esc(c.date)}</span> · <b>${linkify(c.what)}</b></div><div><span class="old num">${esc(c.old)}</span> → <span class="new num">${esc(c.new)}</span></div><div class="why">${linkify(c.why)}${c.where ? ` <span class="mono muted">${c.whereUrl ? `<a href="${esc(c.whereUrl)}" target="_blank" rel="noopener">${esc(c.where)}</a>` : esc(c.where)}</span>` : ''}</div></li>`).join('')}</ol>`))
  }

  /* ---------- not measured ---------- */
  if (V.unmeasured.length) {
    app.append(el('section', { id: 'unmeasured', 'data-nav': 'Not measured', 'aria-labelledby': 'h-unm' }, `<div class="section-head"><h2 id="h-unm">Not measured yet</h2></div>
      <ul class="gaps">${V.unmeasured.map(u => `<li><div><b>${linkify(u.what)}</b> ${u.metrics.map(id => `<span class="chip">${esc(metricsById[id]?.short ?? metricsById[id]?.name ?? id)}</span>`).join(' ')}</div>${u.waiting ? `<div class="why">Waiting on ${linkify(u.waiting)}</div>` : ''}</li>`).join('')}</ul>`))
  }

  /* ---------- reports ---------- */
  if (V.reports.length) {
    app.append(el('section', { id: 'reports', 'data-nav': 'Reports', 'aria-labelledby': 'h-rep' }, `<div class="section-head"><h2 id="h-rep">Reports</h2></div>
      <ol class="reports">${V.reports.map(r => `<li id="${esc(r.id)}"><span class="rid">${esc(r.id)}</span><a href="${esc(r.href)}" target="_blank" rel="noopener">${esc(r.title)}</a><span class="rmeta">${esc(r.date ?? '')}${r.experiment ? ` · from ${linkify(r.experiment)}` : ''}</span></li>`).join('')}</ol>`))
  }

  // Sticky nav to every section on the page.
  const nav = el('nav', { class: 'nav', 'aria-label': 'Sections' }, [...app.querySelectorAll('section[data-nav]')].map(sec => `<a href="#${sec.id}">${esc(sec.dataset.nav)}</a>`).join(''))
  top.after(nav)
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); document.getElementById(a.getAttribute('href').slice(1)).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }) }))

  app.append(el('footer', {}, `Built from the ledger${V.branch ? ` on <span class="mono">${esc(V.branch.name)}</span>` : ''}.`))

  render()
  bindRefs(document)
  if (location.hash && exps[location.hash.slice(1)]) jumpTo(location.hash.slice(1))
})()
</script>
